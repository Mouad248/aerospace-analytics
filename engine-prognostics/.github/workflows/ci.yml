name: project-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-and-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and project checks
        run: python -m pip install -e ".[dev]"
      - name: Run the focused pipeline suite
        run: python -m pytest -q
      - name: Build the deployment image
        run: docker build -t engine-prognostics:${{ github.sha }} .
